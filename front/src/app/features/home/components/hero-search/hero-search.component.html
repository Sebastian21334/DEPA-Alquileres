<section class="hero">
  <div class="hero__inner">
    <h1 class="hero__title">Encontrá tu próximo hogar</h1>
    <p class="hero__subtitle">¿Qué tipo de alquiler estás buscando?</p>

    @if (modalidades().length) {
      <div class="hero__modalidades">
        @for (m of modalidadesOrdenadas(); track m.id; let i = $index) {
          <a
            [routerLink]="['/publicaciones']"
            [queryParams]="{ categoria: categoriaDe(m) }"
            class="modalidad-btn"
            [class.modalidad-btn--primary]="!esTemporaria(m)"
            [class.modalidad-btn--secondary]="esTemporaria(m)"
          >
            {{ m.nombre }}
          </a>
        }
      </div>
    }

    <div class="hero__search">
      <label class="hero__search-label" for="busqueda">Buscá lo que necesitás</label>
      <div class="hero__search-actions">
      <form class="hero__search-row" [formGroup]="form()" (ngSubmit)="onSubmit()" role="search">
        <input
          id="busqueda"
          type="text"
          formControlName="busqueda"
          placeholder="Título, descripción, ciudad, tipo de propiedad..."
          autocomplete="off"
        />
        <button type="submit" class="btn btn--primary" aria-label="Buscar propiedades">
          <svg lucideSearch [size]="20" aria-hidden="true"></svg>
        </button>
      </form>
      <a class="hero__map" routerLink="/publicaciones" aria-label="Ver mapa" title="Ver mapa"
         [queryParams]="{ vista: 'mapa', q: terminoBusqueda() || null }">
        <svg lucideMap [size]="23" aria-hidden="true"></svg>
      </a>
      </div>
    </div>
  </div>
</section>
